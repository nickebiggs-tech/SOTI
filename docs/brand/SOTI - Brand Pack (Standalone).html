  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

gin:0;padding:0;}\n  body{\n    background:var(--void);color:var(--text);\n    font-family:var(--display);font-weight:500;font-size:14.5px;line-height:1.55;\n    -webkit-font-smoothing:antialiased;\n    background-image:\n      radial-gradient(ellipse at 82% -8%, rgba(94,221,255,.08), transparent 50%),\n      radial-gradient(var(--line) 1px, transparent 1px);\n    background-size:auto, 22px 22px;\n    background-position:0 0,-1px -1px;\n    background-attachment:fixed;\n  }\n  .wrap{max-width:1180px;margin:0 auto;padding:0 30px 120px;}\n\n  .statusbar{\n    position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;\n    padding:11px 30px;margin:0 -30px 0;border-bottom:1px solid var(--line);\n    background:color-mix(in srgb,var(--void) 88%,transparent);backdrop-filter:blur(10px);\n    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);\n  }\n  .statusbar .l{color:var(--signal);}\n  .statusbar .l b{color:var(--text);font-weight:600;}\n  .statusbar .r{display:flex;gap:18px;}\n  .statusbar .r .ok{color:var(--echo);}\n\n  /* wordmark */\n  .smark{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:.9;display:inline-flex;align-items:flex-start;}\n  .smark .ping{width:.16em;height:.16em;min-width:9px;min-height:9px;border-radius:50%;background:var(--echo);margin-left:.14em;margin-top:.18em;box-shadow:0 0 0 0 color-mix(in srgb,var(--echo) 70%,transparent);}\n  @media(prefers-reduced-motion:no-preference){\n    .smark .ping{animation:ping 2.6s ease-out infinite;}\n    @keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--echo) 60%,transparent);}70%{box-shadow:0 0 0 .9em transparent;}100%{box-shadow:0 0 0 0 transparent;}}\n  }\n  .smark .mod{color:var(--signal);font-style:italic;font-weight:700;}\n\n  /* cover */\n  .cover{padding:70px 0 46px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:end;}\n  .cover .kick{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--signal);margin-bottom:26px;}\n  .cover .smark{font-size:clamp(86px,15vw,184px);}\n  .cover .full{margin:14px 0 0;font-family:var(--mono);font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);}\n  .cover .sub{margin:24px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(17px,2vw,23px);letter-spacing:-.01em;max-width:30ch;line-height:1.3;}\n  .cover .sub em{font-style:italic;color:var(--signal);}\n  .meta{border:1px solid var(--line);background:var(--panel-2);}\n  .meta .mh{padding:9px 15px;border-bottom:1px solid var(--line);background:var(--panel-3);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}\n  .meta .line{display:flex;justify-content:space-between;gap:16px;padding:10px 15px;border-bottom:1px dashed var(--line);font-family:var(--mono);font-size:11.5px;}\n  .meta .line:last-child{border-bottom:0;}\n  .meta .line b{color:var(--dim);font-weight:400;text-transform:uppercase;letter-spacing:.1em;font-size:10px;}\n  .meta .line span{color:var(--text);}\n  .meta .line span.sig{color:var(--signal);}\n\n  .sec{padding:64px 0 0;}\n  .sec-head{display:flex;align-items:baseline;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:30px;}\n  .sec-head .pageno{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--on-signal);background:var(--signal);padding:3px 8px;align-self:center;}\n  .sec-head .num{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--signal);}\n  .sec-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(24px,3vw,32px);letter-spacing:-.025em;}\n  .sec-head h2 em{font-style:italic;color:var(--signal);}\n  .sec-head .ann{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}\n\n  .lede{font-family:var(--display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.38;letter-spacing:-.015em;max-width:38ch;}\n  .lede em{font-style:italic;color:var(--signal);}\n  .prose{font-family:var(--mono);font-size:13px;line-height:1.75;color:var(--dim);max-width:64ch;}\n  .prose p{margin:14px 0;}\n  .prose b{color:var(--text);font-weight:500;}\n  .prose .sig{color:var(--signal);}\n\n  .two{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start;}\n  @media(max-width:820px){.two{grid-template-columns:1fr;} .cover{grid-template-columns:1fr;align-items:start;}}\n\n  .card{border:1px solid var(--line);background:var(--panel);}\n  .card .ch{padding:9px 15px;border-bottom:1px solid var(--line);background:var(--panel-2);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}\n  .card .ch .c{color:var(--signal);}\n  .card .cb{padding:20px;}\n\n  /* modules */\n  .mods{display:grid;grid-template-columns:1fr 1fr;gap:18px;}\n  @media(max-width:760px){.mods{grid-template-columns:1fr;}}\n  .mod-card{border:1px solid var(--line);background:var(--panel);padding:24px;display:flex;flex-direction:column;gap:14px;}\n  .mod-card .top{display:flex;justify-content:space-between;align-items:center;}\n  .mod-card .mk{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.01em;}\n  .mod-card .mk .mod{color:var(--signal);font-style:italic;}\n  .mod-card .tagn{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line-2);padding:4px 9px;}\n  .mod-card p{margin:0;font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--dim);}\n  .mod-card p b{color:var(--text);font-weight:500;}\n  .mod-card .cls{font-family:var(--mono);font-size:10.5px;color:var(--signal);letter-spacing:.04em;}\n\n  /* swatches / type */\n  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}\n  @media(max-width:680px){.swatches{grid-template-columns:repeat(2,1fr);}}\n  .sw{border:1px solid var(--line);background:var(--panel);}\n  .sw .chip{height:70px;border-bottom:1px solid var(--line);}\n  .sw .info{padding:10px 12px;font-family:var(--mono);}\n  .sw .info .nm{font-size:11.5px;color:var(--text);}\n  .sw .info .hex{font-size:10.5px;color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.08em;}\n  .sw .info .use{font-size:9.5px;color:var(--dim-2);margin-top:6px;text-transform:uppercase;letter-spacing:.1em;}\n  .typ{border:1px solid var(--line);background:var(--panel);padding:22px;}\n  .typ .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between;}\n  .typ .lab .sig{color:var(--signal);}\n  .typ .big{font-family:var(--display);font-weight:800;font-size:clamp(30px,4vw,46px);letter-spacing:.01em;line-height:1;}\n  .typ .mono-big{font-family:var(--mono);font-size:clamp(19px,2.3vw,25px);color:var(--text);}\n  .typ .scale{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.9;}\n  .typ .scale .sig{color:var(--signal);}\n\n  /* metric cards */\n  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}\n  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr);}}\n  .kpi{border:1px solid var(--line);background:var(--panel);padding:18px;}\n  .kpi .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}\n  .kpi .val{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.02em;margin-top:10px;line-height:1;}\n  .kpi .val .u{font-size:.5em;color:var(--dim);font-weight:600;letter-spacing:0;}\n  .kpi .delta{font-family:var(--mono);font-size:11px;margin-top:9px;color:var(--echo);}\n  .kpi .delta.down{color:var(--warm);}\n  .kpi .delta .sub{color:var(--dim);}\n\n  /* dashboard mockup */\n  .screen{border:1px solid var(--line-2);background:var(--panel);overflow:hidden;box-shadow:0 30px 80px -40px rgba(0,0,0,.9);}\n  .screen .titlebar{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);}\n  .screen .titlebar .dots{display:flex;gap:6px;}\n  .screen .titlebar .dots span{width:9px;height:9px;border-radius:50%;background:var(--line-2);}\n  .screen .titlebar .url{margin-left:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);}\n  .screen .titlebar .url b{color:var(--text);font-weight:500;}\n  .dash{padding:20px 22px;}\n  .dash .dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px;}\n  .dash .dtop .bot{display:flex;align-items:center;gap:11px;}\n  .dash .dtop .bot .ping{width:11px;height:11px;border-radius:50%;background:var(--echo);box-shadow:0 0 10px var(--echo);}\n  .dash .dtop .bot h3{margin:0;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;}\n  .dash .dtop .bot .s{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.04em;}\n  .seg{display:inline-flex;border:1px solid var(--line-2);}\n  .seg span{font-family:var(--mono);font-size:11px;padding:8px 14px;color:var(--dim);border-left:1px solid var(--line-2);letter-spacing:.04em;}\n  .seg span:first-child{border-left:0;}\n  .seg span.on{background:var(--signal);color:var(--on-signal);font-weight:600;}\n  .crumb{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}\n  .crumb .c{color:var(--signal);}\n  .crumb .here{color:var(--text);border-bottom:1px solid var(--signal);}\n  .crumb .sep{color:var(--dim-2);}\n\n  .bars{display:flex;flex-direction:column;gap:11px;margin-top:4px;}\n  .bar{display:grid;grid-template-columns:160px 1fr 96px;gap:14px;align-items:center;}\n  .bar .nm{font-family:var(--mono);font-size:11.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n  .bar .track{height:16px;background:var(--void);border:1px solid var(--line);position:relative;overflow:hidden;}\n  .bar .fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--signal) 30%,transparent),var(--signal));}\n  .bar .d{font-family:var(--mono);font-size:11px;text-align:right;color:var(--echo);}\n  .bar .d.down{color:var(--warm);}\n  .bar .d .sub{color:var(--dim);}\n\n  .splitcols{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:18px;}\n  @media(max-width:760px){.splitcols{grid-template-columns:1fr;} .bar{grid-template-columns:120px 1fr 80px;}}\n  .basket{border:1px solid var(--line);background:var(--void);padding:16px;}\n  .basket .bh{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:13px;}\n  .basket .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--text);}\n  .basket .row:last-child{border-bottom:0;}\n  .basket .row .g{color:var(--echo);}\n  .basket .row .g.down{color:var(--warm);}\n\n  .dfoot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:16px;padding:11px 14px;border:1px solid var(--line);background:var(--void);font-family:var(--mono);font-size:11px;color:var(--dim);}\n  .dfoot .sig{color:var(--signal);}\n  .dfoot .ok{color:var(--echo);}\n\n  /* methodology */\n  .method{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);}\n  @media(max-width:760px){.method{grid-template-columns:1fr;}}\n  .method .m{padding:20px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}\n  .method .m:nth-child(2n){border-right:0;}\n  .method .m h4{margin:0 0 9px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--signal);display:flex;gap:9px;}\n  .method .m h4 .x{color:var(--dim-2);}\n  .method .m p{margin:0;font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--dim);}\n  .method .m p b{color:var(--text);font-weight:500;}\n  .classnote{margin-top:18px;border:1px solid var(--line);background:var(--panel-2);padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--dim);}\n  .classnote b{color:var(--text);font-weight:500;}\n  .classnote .sig{color:var(--signal);}\n\n  /* audience */\n  .aud{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}\n  @media(max-width:760px){.aud{grid-template-columns:repeat(2,1fr);}}\n  .aud .a{border:1px solid var(--line);background:var(--panel);padding:18px;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;}\n  .aud .a .n{font-family:var(--mono);font-size:10px;color:var(--dim-2);letter-spacing:.12em;}\n  .aud .a .t{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;}\n  .aud .a .d{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.5;}\n\n  /* CTA */\n  .cta{border:1px solid var(--signal);background:linear-gradient(180deg,color-mix(in srgb,var(--signal) 8%,transparent),transparent);padding:40px;display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center;}\n  @media(max-width:760px){.cta{grid-template-columns:1fr;}}\n  .cta h3{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,32px);letter-spacing:-.02em;line-height:1.1;}\n  .cta h3 em{font-style:italic;color:var(--signal);}\n  .cta p{margin:14px 0 0;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--dim);}\n  .cta p b{color:var(--text);font-weight:500;}\n  .cta .box{border:1px solid var(--line);background:var(--void);}\n  .cta .box .bh{padding:9px 15px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}\n  .cta .box .line{display:flex;justify-content:space-between;gap:14px;padding:11px 15px;border-bottom:1px dashed var(--line);font-family:var(--mono);font-size:12px;}\n  .cta .box .line:last-child{border-bottom:0;}\n  .cta .box .line b{color:var(--dim);font-weight:400;text-transform:uppercase;font-size:10px;letter-spacing:.1em;}\n  .cta .box .line a,.cta .box .line span{color:var(--signal);text-decoration:none;}\n\n  footer{margin-top:70px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2);}\n  footer b{color:var(--dim);font-weight:400;}\n\n  @media print{\n    body{background:#fff !important;color:#000;background-image:none;}\n    .statusbar{position:static;background:#fff;border-color:#ccc;}\n    .sec{padding-top:34px;page-break-inside:avoid;}\n    .screen,.card,.sw,.typ,.kpi,.mod-card,.method,.aud .a,.cta{break-inside:avoid;}\n    .smark .ping{animation:none;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  <div class=\"wrap\">\n\n    <div class=\"statusbar\">\n      <div class=\"l\">$ <b>nostradata<\u002Fb>/state-of-the-industry<\u002Fdiv>\n      <div class=\"r\"><span>whole of australian market<\u002Fspan><span class=\"ok\">● refreshed 6-monthly<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- COVER -->\n    <header class=\"cover\">\n      <div>\n        <div class=\"kick\">Brand pack · market intelligence · powered by NostraData<\u002Fdiv>\n        <span class=\"smark\">SOTI<span class=\"ping\"><\u002Fspan><\u002Fspan>\n        <div class=\"full\">State of the Industry<\u002Fdiv>\n        <p class=\"sub\">Where the whole Australian pharmacy market moved — and where it's <em>heading next<\u002Fem>.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"meta\">\n        <div class=\"mh\">// product record<\u002Fdiv>\n        <div class=\"line\"><b>product<\u002Fb><span class=\"sig\">SOTI<\u002Fspan><\u002Fdiv>\n        <div class=\"line\"><b>format<\u002Fb><span>report + Dash-Bot<\u002Fspan><\u002Fdiv>\n        <div class=\"line\"><b>modules<\u002Fb><span>SOTI·Rx · SOTI·OTC<\u002Fspan><\u002Fdiv>\n        <div class=\"line\"><b>coverage<\u002Fb><span>whole of AU market<\u002Fspan><\u002Fdiv>\n        <div class=\"line\"><b>refresh<\u002Fb><span>every 6 months<\u002Fspan><\u002Fdiv>\n        <div class=\"line\"><b>data<\u002Fb><span>NostraData<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- 01 WHAT IT IS -->\n    <section class=\"sec\">\n      <div class=\"sec-head\">\n        <span class=\"pageno\">01<\u002Fspan>\n        <span class=\"num\">$ ./what_it_is<\u002Fspan>\n        <h2>What <em>SOTI<\u002Fem> is<\u002Fh2>\n        <span class=\"ann\">// the report &amp; the radar<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"two\">\n        <p class=\"lede\">Knowing where the market moved is one thing. Knowing where <em>your<\u002Fem> categories, brands and molecules sit within it is another.<\u002Fp>\n        <div class=\"prose\">\n          <p><b>SOTI — State of the Industry<\u002Fb> measures the entire Australian pharmacy market across two rolling years and tells you what changed. It pairs a published <b>report<\u002Fb> with the <span class=\"sig\">Dash-Bot<\u002Fspan>: an interactive radar that drills from whole-of-market down to <b>category, brand and SKU<\u002Fb>.<\u002Fp>\n          <p>See where share is moving, where growth is forming, and what's in the shopper's basket behind it — in <b>value<\u002Fb> and <b>volume<\u002Fb>, for both prescription and over-the-counter. <span class=\"sig\">Refreshed every six months<\u002Fspan> to keep you ahead of the market.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 02 MODULES -->\n    <section class=\"sec\">\n      <div class=\"sec-head\">\n        <span class=\"pageno\">02<\u002Fspan>\n        <span class=\"num\">$ ./modules<\u002Fspan>\n        <h2>Two modules, one market<\u002Fh2>\n        <span class=\"ann\">// Rx &amp; OTC<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mods\">\n        <div class=\"mod-card\">\n          <div class=\"top\"><span class=\"mk\">SOTI<span class=\"mod\">·Rx<\u002Fspan><\u002Fspan><span class=\"tagn\">prescription<\u002Fspan><\u002Fdiv>\n          <p><b>The prescription market.<\u002Fb> Dispensed scripts across the country — value, volume and the year-on-year shift, down to molecule and brand.<\u002Fp>\n          <span class=\"cls\">grouped by WHO ATC classification<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"mod-card\">\n          <div class=\"top\"><span class=\"mk\">SOTI<span class=\"mod\">·OTC<\u002Fspan><\u002Fspan><span class=\"tagn\">over the counter<\u002Fspan><\u002Fdiv>\n          <p><b>The non-prescription market.<\u002Fb> Everything sold over the counter — the consumer-health basket, by category, brand and SKU.<\u002Fp>\n          <span class=\"cls\">grouped by proprietary OTC categories<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 03 BRAND / DESIGN -->\n    <section class=\"sec\">\n      <div class=\"sec-head\">\n        <span class=\"pageno\">03<\u002Fspan>\n        <span class=\"num\">$ ./brand<\u002Fspan>\n        <h2>The brand<\u002Fh2>\n        <span class=\"ann\">// wordmark · colour · type<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"two\" style=\"margin-bottom:18px;\">\n        <div class=\"card\">\n          <div class=\"ch\"><span>// wordmark · clean · 2 colours<\u002Fspan><span class=\"c\">SOTI<\u002Fspan><\u002Fdiv>\n          <div class=\"cb\" style=\"display:flex;flex-direction:column;gap:22px;align-items:flex-start;justify-content:center;min-height:150px;\">\n            <span class=\"smark\" style=\"font-size:64px;\">SOTI<span class=\"ping\"><\u002Fspan><\u002Fspan>\n            <div style=\"display:flex;gap:18px;flex-wrap:wrap;\">\n              <span class=\"smark\" style=\"font-size:30px;\">SOTI<span class=\"mod\">·Rx<\u002Fspan><\u002Fspan>\n              <span class=\"smark\" style=\"font-size:30px;\">SOTI<span class=\"mod\">·OTC<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"prose\" style=\"max-width:none;align-self:center;\">\n          <p><b>SOTI<\u002Fb> is set in heavy Switzer with a live <span class=\"sig\">mint ping<\u002Fspan> — the radar blip that signals fresh data. The mark stays to <b>two colours<\u002Fb>: bone text and the cyan/mint signal. Module variants append <span class=\"sig\">·Rx<\u002Fspan> and <span class=\"sig\">·OTC<\u002Fspan> in cyan italic. No glyphs, no gradients.<\u002Fp>\n          <p>The aesthetic is <b>infrastructure, not advertising<\u002Fb>: a dark dot-grid surface, monospace for every number, hard 1px borders. It should read like a market terminal.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\" style=\"margin-bottom:18px;\">\n        <div class=\"ch\"><span>// palette · dark terminal<\u002Fspan><span class=\"c\">core tokens<\u002Fspan><\u002Fdiv>\n        <div class=\"cb\">\n          <div class=\"swatches\">\n            <div class=\"sw\"><div class=\"chip\" style=\"background:#020407;box-shadow:inset 0 0 0 1px #1F2934;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Void<\u002Fdiv><div class=\"hex\">#020407<\u002Fdiv><div class=\"use\">surface<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"sw\"><div class=\"chip\" style=\"background:#0C1116;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Panel<\u002Fdiv><div class=\"hex\">#0C1116<\u002Fdiv><div class=\"use\">cards<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"sw\"><div class=\"chip\" style=\"background:#5EDDFF;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Signal cyan<\u002Fdiv><div class=\"hex\">#5EDDFF<\u002Fdiv><div class=\"use\">primary · value<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"sw\"><div class=\"chip\" style=\"background:#6BFFB8;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Echo mint<\u002Fdiv><div class=\"hex\">#6BFFB8<\u002Fdiv><div class=\"use\">growth · live<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"sw\"><div class=\"chip\" style=\"background:#E8F4FF;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Text<\u002Fdiv><div class=\"hex\">#E8F4FF<\u002Fdiv><div class=\"use\">data<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"sw\"><div class=\"chip\" style=\"background:#FF6B47;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Warm<\u002Fdiv><div class=\"hex\">#FF6B47<\u002Fdiv><div class=\"use\">decline<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"sw\"><div class=\"chip\" style=\"background:#5A6573;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Dim<\u002Fdiv><div class=\"hex\">#5A6573<\u002Fdiv><div class=\"use\">labels<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"sw\"><div class=\"chip\" style=\"background:#1F2934;\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Line<\u002Fdiv><div class=\"hex\">#1F2934<\u002Fdiv><div class=\"use\">borders<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"two\">\n        <div class=\"typ\"><div class=\"lab\"><span>Display — Switzer<\u002Fspan><span class=\"sig\">800<\u002Fspan><\u002Fdiv><div class=\"big\">SOTI<\u002Fdiv><div class=\"scale\">Wordmark · 800 · +.01em<br>Headlines · 800 · −.02em<br>KPI values · 800 · −.02em<\u002Fdiv><\u002Fdiv>\n        <div class=\"typ\"><div class=\"lab\"><span>Data — JetBrains Mono<\u002Fspan><span class=\"sig\">400 / 600<\u002Fspan><\u002Fdiv><div class=\"mono-big\">+6.4% · $23.8B · ▲<\u002Fdiv><div class=\"scale\">Every <span class=\"sig\">value, %, and rank<\u002Fspan> is monospace, tabular. Growth in <span class=\"sig\">mint<\u002Fspan>, decline in warm. Labels uppercase, .12em.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 04 METRICS -->\n    <section class=\"sec\">\n      <div class=\"sec-head\">\n        <span class=\"pageno\">04<\u002Fspan>\n        <span class=\"num\">$ ./metrics<\u002Fspan>\n        <h2>Four measures<\u002Fh2>\n        <span class=\"ann\">// value · volume · the change in each<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"kpis\">\n        <div class=\"kpi\"><div class=\"lab\">Pharmacy Value<\u002Fdiv><div class=\"val\">$23.8<span class=\"u\">B<\u002Fspan><\u002Fdiv><div class=\"delta\"><span class=\"sub\">Apr 25 – Mar 26<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"kpi\"><div class=\"lab\">Value Change<\u002Fdiv><div class=\"val\" style=\"color:var(--echo);\">+6.4%<\u002Fdiv><div class=\"delta\"><span class=\"sub\">vs prior 12 months<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"kpi\"><div class=\"lab\">Pharmacy Volume<\u002Fdiv><div class=\"val\">1.71<span class=\"u\">B units<\u002Fspan><\u002Fdiv><div class=\"delta\"><span class=\"sub\">most recent 12 months<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"kpi\"><div class=\"lab\">Volume Change<\u002Fdiv><div class=\"val\" style=\"color:var(--echo);\">+2.1%<\u002Fdiv><div class=\"delta\"><span class=\"sub\">vs prior 12 months<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prose\" style=\"margin-top:18px;max-width:none;\">\n        <p>› <b>Pharmacy Value<\u002Fb> — total retail value of pharmacy sales, average sale price × units sold. &nbsp; › <b>Value Change<\u002Fb> — the difference between the two 12-month periods. &nbsp; › <b>Pharmacy Volume<\u002Fb> — units dispensed or sold in the most recent year. &nbsp; › <b>Volume Change<\u002Fb> — the year-on-year shift in units. &nbsp;<span class=\"sig\">Figures shown are illustrative.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 05 DASH-BOT -->\n    <section class=\"sec\">\n      <div class=\"sec-head\">\n        <span class=\"pageno\">05<\u002Fspan>\n        <span class=\"num\">$ ./dash-bot<\u002Fspan>\n        <h2>The Dash-Bot<\u002Fh2>\n        <span class=\"ann\">// whole-market → category → brand → SKU<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"screen\">\n        <div class=\"titlebar\"><div class=\"dots\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv><div class=\"url\"><b>SOTI<\u002Fb> · Dash-Bot · whole of market<\u002Fdiv><\u002Fdiv>\n        <div class=\"dash\">\n          <div class=\"dtop\">\n            <div class=\"bot\"><span class=\"ping\"><\u002Fspan><div><h3>State of the Industry · Dash-Bot<\u002Fh3><div class=\"s\">Apr 2025 – Mar 2026 vs Apr 2024 – Mar 2025 · refreshed 6-monthly<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"seg\"><span class=\"on\">SOTI·Rx<\u002Fspan><span>SOTI·OTC<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"crumb\"><span class=\"c\">Whole of market<\u002Fspan><span class=\"sep\">›<\u002Fspan><span>Category<\u002Fspan><span class=\"sep\">›<\u002Fspan><span>Brand<\u002Fspan><span class=\"sep\">›<\u002Fspan><span>SKU<\u002Fspan><span class=\"sep\" style=\"margin-left:auto;\"><\u002Fspan><span class=\"here\">drill: top categories by value<\u002Fspan><\u002Fdiv>\n\n          <div class=\"kpis\" style=\"margin-bottom:18px;\">\n            <div class=\"kpi\" style=\"padding:14px;\"><div class=\"lab\">Value<\u002Fdiv><div class=\"val\" style=\"font-size:26px;\">$23.8<span class=\"u\">B<\u002Fspan><\u002Fdiv><div class=\"delta\">+6.4% <span class=\"sub\">YoY<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div class=\"kpi\" style=\"padding:14px;\"><div class=\"lab\">Volume<\u002Fdiv><div class=\"val\" style=\"font-size:26px;\">1.71<span class=\"u\">B<\u002Fspan><\u002Fdiv><div class=\"delta\">+2.1% <span class=\"sub\">YoY<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div class=\"kpi\" style=\"padding:14px;\"><div class=\"lab\">Avg price / unit<\u002Fdiv><div class=\"val\" style=\"font-size:26px;\">$13.92<\u002Fdiv><div class=\"delta\">+4.2% <span class=\"sub\">YoY<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div class=\"kpi\" style=\"padding:14px;\"><div class=\"lab\">Categories tracked<\u002Fdiv><div class=\"val\" style=\"font-size:26px;\">412<\u002Fdiv><div class=\"delta\"><span class=\"sub\">Rx + OTC<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"splitcols\">\n            <div>\n              <div class=\"basket\" style=\"border:0;padding:0;\">\n                <div class=\"bh\">Top categories · value change YoY<\u002Fdiv>\n                <div class=\"bars\">\n                  <div class=\"bar\"><span class=\"nm\">Cardiovascular<\u002Fspan><span class=\"track\"><span class=\"fill\" style=\"width:86%;\"><\u002Fspan><\u002Fspan><span class=\"d\">$4.1B <span class=\"sub\">+5.2%<\u002Fspan><\u002Fspan><\u002Fdiv>\n                  <div class=\"bar\"><span class=\"nm\">Diabetes<\u002Fspan><span class=\"track\"><span class=\"fill\" style=\"width:72%;\"><\u002Fspan><\u002Fspan><span class=\"d\">$3.4B <span class=\"sub\">+11.8%<\u002Fspan><\u002Fspan><\u002Fdiv>\n                  <div class=\"bar\"><span class=\"nm\">Vitamins &amp; supps<\u002Fspan><span class=\"track\"><span class=\"fill\" style=\"width:64%;\"><\u002Fspan><\u002Fspan><span class=\"d\">$3.0B <span class=\"sub\">+7.1%<\u002Fspan><\u002Fspan><\u002Fdiv>\n                  <div class=\"bar\"><span class=\"nm\">Analgesics<\u002Fspan><span class=\"track\"><span class=\"fill\" style=\"width:55%;\"><\u002Fspan><\u002Fspan><span class=\"d\">$2.6B <span class=\"sub\">+3.0%<\u002Fspan><\u002Fspan><\u002Fdiv>\n                  <div class=\"bar\"><span class=\"nm\">Respiratory<\u002Fspan><span class=\"track\"><span class=\"fill\" style=\"width:48%;\"><\u002Fspan><\u002Fspan><span class=\"d\">$2.2B <span class=\"sub\">+4.6%<\u002Fspan><\u002Fspan><\u002Fdiv>\n                  <div class=\"bar\"><span class=\"nm\">Cough &amp; cold<\u002Fspan><span class=\"track\"><span class=\"fill\" style=\"width:34%;\"><\u002Fspan><\u002Fspan><span class=\"d down\">$1.6B <span class=\"sub\">−2.3%<\u002Fspan><\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"basket\">\n              <div class=\"bh\">In the basket · Cardiovascular ▸ top brands<\u002Fdiv>\n              <div class=\"row\"><span>Brand A · atorvastatin<\u002Fspan><span class=\"g\">+8.1%<\u002Fspan><\u002Fdiv>\n              <div class=\"row\"><span>Brand B · perindopril<\u002Fspan><span class=\"g\">+5.4%<\u002Fspan><\u002Fdiv>\n              <div class=\"row\"><span>Brand C · rosuvastatin<\u002Fspan><span class=\"g\">+12.6%<\u002Fspan><\u002Fdiv>\n              <div class=\"row\"><span>Brand D · metoprolol<\u002Fspan><span class=\"g down\">−1.2%<\u002Fspan><\u002Fdiv>\n              <div class=\"row\"><span>Brand E · clopidogrel<\u002Fspan><span class=\"g\">+2.9%<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"dfoot\">\n            <span>$ soti drill --category cardiovascular --by brand<\u002Fspan>\n            <span><span class=\"sig\">whole-of-market AU<\u002Fspan> · <span class=\"ok\">value + volume · Rx &amp; OTC<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"prose\" style=\"margin-top:14px;\">Drill any bar to brand, any brand to SKU. Toggle <span class=\"sig\">SOTI·Rx ↔ SOTI·OTC<\u002Fspan> to switch markets. Every figure carries its year-on-year change in value and volume.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- 06 METHODOLOGY -->\n    <section class=\"sec\">\n      <div class=\"sec-head\">\n        <span class=\"pageno\">06<\u002Fspan>\n        <span class=\"num\">$ ./methodology<\u002Fspan>\n        <h2>Methodology<\u002Fh2>\n        <span class=\"ann\">// how the numbers are built<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"method\">\n        <div class=\"m\"><h4><span class=\"x\">→<\u002Fspan> Pharmacy Value<\u002Fh4><p>The total retail value of pharmacy sales across two yearly periods, <b>April 2024 to March 2026<\u002Fb>. Calculated by multiplying the average sale price of items by the quantity sold in each period.<\u002Fp><\u002Fdiv>\n        <div class=\"m\"><h4><span class=\"x\">→<\u002Fspan> Value Change<\u002Fh4><p>The difference in Pharmacy Value between the first year (<b>Apr 2024 – Mar 2025<\u002Fb>) and the second (<b>Apr 2025 – Mar 2026<\u002Fb>).<\u002Fp><\u002Fdiv>\n        <div class=\"m\"><h4><span class=\"x\">→<\u002Fspan> Pharmacy Volume<\u002Fh4><p>The units dispensed or sold in the <b>most recent 12-month period<\u002Fb>.<\u002Fp><\u002Fdiv>\n        <div class=\"m\"><h4><span class=\"x\">→<\u002Fspan> Volume Change<\u002Fh4><p>The difference in Pharmacy Volume between the first and second 12-month reporting periods.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"classnote\">\n        <b>Average sale price.<\u002Fb> NostraData first determines the average sale price — including the price paid by patients for prescriptions and government recovery where applicable, and the net sales price for OTC items — then applies it to total units sold to evaluate total sales. <br><br>\n        <b>Classification.<\u002Fb> Products are categorised into prescription and non-prescription (OTC). <span class=\"sig\">Prescription<\u002Fspan> products are grouped by the World Health Organization's <b>Anatomical Therapeutic Chemical (ATC)<\u002Fb> classification; <span class=\"sig\">OTC<\u002Fspan> categories follow proprietary classifications.\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 07 WHO IT'S FOR -->\n    <section class=\"sec\">\n      <div class=\"sec-head\">\n        <span class=\"pageno\">07<\u002Fspan>\n        <span class=\"num\">$ ./audience<\u002Fspan>\n        <h2>Who it's for<\u002Fh2>\n        <span class=\"ann\">// a must-have radar<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"aud\">\n        <div class=\"a\"><div class=\"n\">01<\u002Fdiv><div class=\"t\">Banners<\u002Fdiv><div class=\"d\">Benchmark your network against the whole market.<\u002Fdiv><\u002Fdiv>\n        <div class=\"a\"><div class=\"n\">02<\u002Fdiv><div class=\"t\">Groups<\u002Fdiv><div class=\"d\">See where share is forming before it shows up in sales.<\u002Fdiv><\u002Fdiv>\n        <div class=\"a\"><div class=\"n\">03<\u002Fdiv><div class=\"t\">Suppliers<\u002Fdiv><div class=\"d\">Track your categories, brands and SKUs in context.<\u002Fdiv><\u002Fdiv>\n        <div class=\"a\"><div class=\"n\">04<\u002Fdiv><div class=\"t\">Consumer health<\u002Fdiv><div class=\"d\">Read the OTC basket and where the shopper is moving.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- CTA -->\n    <section class=\"sec\">\n      <div class=\"cta\">\n        <div>\n          <h3>Want to see where the market is <em>heading<\u002Fem>?<\u002Fh3>\n          <p>The State of the Industry Dash-Bot is the radar to the report's forecast — drill from whole-of-market down to category, brand and SKU. <b>Refreshed every six months to keep you ahead of the market.<\u002Fb><\u002Fp>\n        <\u002Fdiv>\n        <div class=\"box\">\n          <div class=\"bh\">// get access<\u002Fdiv>\n          <div class=\"line\"><b>contact<\u002Fb><a href=\"mailto:sales@nostradata.com.au\">sales@nostradata.com.au<\u002Fa><\u002Fdiv>\n          <div class=\"line\"><b>product<\u002Fb><span>SOTI · Dash-Bot<\u002Fspan><\u002Fdiv>\n          <div class=\"line\"><b>refresh<\u002Fb><span>every 6 months<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer>\n      <div><b>SOTI<\u002Fb> · State of the Industry · powered by NostraData<\u002Fdiv>\n      <div>whole of AU market · value + volume · Rx &amp; OTC<\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
